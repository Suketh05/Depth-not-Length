# Vendor-reported / published claims (Tier 2).
#
# This file holds numbers REPORTED BY VENDORS or their papers, under THEIR OWN
# conditions. They are NEVER mixed with numbers we measured under identical
# conditions (Tier 1); the analysis layer keeps the two tiers in separate, labelled
# columns. Every entry carries a source_url and the conditions under which the
# number was produced. Entries with `needs_citation: true` are placeholders pending
# a verified primary source and must not be published until verified.
#
# Recording a competitor's strong published numbers here (rather than hiding them)
# is what makes the comparison read as generous and independent.

claims:
  # --- Brief's own publicly stated proof points (from briefhq.ai) -------------
  - system: Brief
    category: structured_context_layer
    metric: agent_decision_compliance
    value: 0.95
    baseline_value: 0.46
    unit: fraction
    source_url: https://briefhq.ai/return-on-tokens/
    conditions: "dcbench-style coding tasks; Brief context vs codebase-alone; vendor-reported"
    accessed: "2026-06-18"
    needs_citation: false
  - system: Brief
    category: structured_context_layer
    metric: merge_ready_tasks
    value: 1.0
    baseline_value: 0.25
    unit: fraction
    source_url: https://briefhq.ai/return-on-tokens/
    conditions: "8/8 merge-ready with Brief vs 2/8 without; vendor-reported"
    accessed: "2026-06-18"
    needs_citation: false
  - system: Brief
    category: token_economics
    metric: cost_per_merge_ready_task_reduction
    value: 0.68
    unit: fraction
    source_url: https://briefhq.ai/return-on-tokens/
    conditions: "$2.07 -> $0.66 per merge-ready task; ~identical total tokens; vendor-reported"
    accessed: "2026-06-18"
    needs_citation: false

  # --- Competitor published claims (PENDING VERIFICATION before publication) --
  - system: Mem0
    category: llm_extraction_memory
    metric: relative_accuracy_improvement_over_openai_memory
    value: null
    unit: fraction
    source_url: https://arxiv.org/abs/2504.19413
    conditions: "Mem0 paper, LOCOMO benchmark; different dataset/metric; VERIFY exact figure"
    accessed: "2026-06-18"
    needs_citation: true
  - system: Zep
    category: temporal_knowledge_graph_memory
    metric: deep_memory_retrieval_accuracy
    value: null
    unit: fraction
    source_url: https://arxiv.org/abs/2501.13956
    conditions: "Zep/Graphiti paper, DMR + LongMemEval; different conditions; VERIFY exact figure"
    accessed: "2026-06-18"
    needs_citation: true
  - system: GraphRAG
    category: community_graph_rag
    metric: answer_comprehensiveness_winrate_vs_vector_rag
    value: null
    unit: fraction
    source_url: https://arxiv.org/abs/2404.16130
    conditions: "Microsoft GraphRAG paper; LLM-judged comprehensiveness; VERIFY exact figure"
    accessed: "2026-06-18"
    needs_citation: true

  # --- Vendor-reported rows the paper's landscape table cites (tab:landscape) --
  # These two rows complete the five-system landscape table (Table tab:landscape:
  # Mem0 66.9, Zep 94.8, GraphRAG 77.5, Supermemory 59.7, MemGPT 93.4). Values are
  # transcribed verbatim from tab:landscape ("score" -> value; "vs base" ->
  # baseline_value), each a self-reported number under the vendor's own benchmark,
  # baseline, and model. They remain Tier-2 and are never mixed with our measured
  # (Tier-1) numbers -- exactly the separation the paper draws around tab:landscape.
  - system: MemGPT
    category: paged_memory_os
    metric: deep_memory_retrieval_accuracy
    value: 93.4
    baseline_value: null
    unit: percent
    source_url: https://arxiv.org/abs/2310.08560
    conditions: "MemGPT/Letta, Deep Memory Retrieval (DMR); self-reported; tab:landscape score 93.4 (no vs-base reported)"
    accessed: "2026-06-18"
    needs_citation: false
  - system: Supermemory
    category: managed_long_term_store
    metric: locomo_precision_at_one
    value: 59.7
    baseline_value: 34.4
    unit: percent
    source_url: "https://supermemory.ai (LoCoMo & SWE-ContextBench evaluations, self-reported; cited as tab:landscape)"
    conditions: "Supermemory LoCoMo precision-at-one, P@1 (self-reported); tab:landscape score 59.7, vs base 34.4; VERIFY primary source before publication"
    accessed: "2026-06-18"
    needs_citation: true
